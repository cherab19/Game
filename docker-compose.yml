services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: game_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Game.Backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=game_backend;Username=postgres;Password=postgres
      Jwt__Issuer: Game.Backend
      Jwt__Audience: Game.UnityClient
      Jwt__Key: LocalDevelopmentSecretKeyThatMustBeChanged123!
    ports:
      - "8080:8080"

volumes:
  postgres_data: